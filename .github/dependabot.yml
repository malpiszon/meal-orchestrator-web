version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TS 7 is blocked until @astrojs/check and typescript-eslint support it
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Private GitHub Packages scope; Dependabot has no token, bumped by hand
      - dependency-name: "@malpiszon/ai-toolkit"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
