name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Supersede outdated PR runs; never cancel master runs (they gate deploy).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm test
      - run: npx astro check
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  # Docs-only PRs skip smoke; a skipped job still satisfies required checks. Pushes to master always run it (deploy needs it).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD is the PR's merge commit; its first parent is master. --no-renames lists both paths of a move.
          # A failing git diff fails this step (it isn't piped), and smoke then runs anyway.
          changed=$(git diff --no-renames --name-only HEAD^1 HEAD)
          code_files=$(grep -vE '^[^/]+\.md$|^docs/|^context/|^\.claude/' <<< "$changed" || true)
          echo "Non-docs files: ${code_files:-none}"
          echo "code=$([ -n "$code_files" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  smoke:
    needs: changes
    # Fail closed: if the changes job didn't succeed, run smoke rather than skip it.
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    env:
      # Test-only token shared by the preview (.env/.dev.vars) and the smoke script; not a secret.
      MO_INGEST_TOKEN: ci-smoke-mo-ingest-token
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # No version: setup-cli v3 uses the CLI version pinned in package-lock.json.
      - uses: supabase/setup-cli@v3
      - run: npm ci
      - name: Start local Supabase
        run: |
          # Mailpit stays on: the smoke test reads a real password-reset email from it.
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|MAILPIT_URL|INBUCKET_URL)=' > supabase.env
      - name: Run database tests
        run: supabase test db
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\nMO_INGEST_TOKEN=%s\n' \
            "$API_URL" "$ANON_KEY" "$SERVICE_ROLE_KEY" "$MO_INGEST_TOKEN" > .env
          cp .env .dev.vars
      - run: npm run build
      - name: Run smoke test against production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          source supabase.env
          # Older CLIs name Mailpit's URL INBUCKET_URL; 54324 is its port in supabase/config.toml.
          MAILPIT_URL="${MAILPIT_URL:-${INBUCKET_URL:-http://127.0.0.1:54324}}"
          BASE_URL=http://localhost:4321 MO_INGEST_TOKEN="$MO_INGEST_TOKEN" SUPABASE_URL="$API_URL" SUPABASE_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" MAILPIT_URL="$MAILPIT_URL" npm run smoke
      - name: Run keepalive failure-mode smoke
        run: |
          npx astro preview stop
          # Unreachable on purpose: proves the scheduled invocation reports failure when the RPC can't reach Supabase.
          printf 'SUPABASE_URL=http://127.0.0.1:1\nSUPABASE_KEY=unreachable\n' | tee .env .dev.vars > /dev/null
          npm run build
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          KEEPALIVE_EXPECT_FAILURE=1 BASE_URL=http://localhost:4321 npm run smoke
      - if: always()
        run: supabase stop --no-backup

  deploy:
    needs: [ci, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      PROD_URL: https://mo-web.malpiszon.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Workers deploy (never `wrangler pages`); runtime secrets live in Workers Secrets, not here.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Post-deploy smoke
        run: |
          curl -sf -o /dev/null "$PROD_URL/auth/signin"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$PROD_URL/dashboard")" = 302
          # Fails if Worker secrets are missing (the redirect then carries error=not_configured) instead of reaching Supabase.
          location=$(curl -s -o /dev/null -w '%{redirect_url}' -X POST -H "Origin: $PROD_URL" \
            -d 'email=ci-probe%40example.com&password=not-a-real-password' "$PROD_URL/api/auth/signin")
          echo "$location"
          echo "$location" | grep -q 'error=invalid_credentials'
          # MO delivery endpoint without a token must answer 401. A 503 means the Worker secrets
          # SUPABASE_SERVICE_ROLE_KEY / MO_INGEST_TOKEN are missing; a 403 or challenge page means
          # Cloudflare bot protection is blocking machine-to-machine calls, so MO couldn't deliver either.
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{}' "$PROD_URL/api/mo/deliveries")
          echo "mo deliveries without token -> $status"
          test "$status" = 401
